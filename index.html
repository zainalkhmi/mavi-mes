<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAVI MES — Manufacturing Execution System</title>
    <style>
      /* Boot splash — must live in <head> so it paints BEFORE any JS/CSS bundle loads.
         This prevents the blank white flash while Vite + React initialise. */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        /* Match the splash background so there's no white gap at any point */
        background: #080f21;
      }
      #mavi-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f1c3f 0%, #080f21 100%);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        /* Smooth fade-out when React hides it */
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #mavi-boot-splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #mavi-boot-splash .logo-glow {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: #3b82f6;
        text-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        margin-bottom: 5px;
        animation: _bp_logoPulse 2s ease-in-out infinite;
      }
      #mavi-boot-splash .logo-sub {
        font-size: 0.85rem;
        font-weight: 600;
        color: #94a3b8;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-bottom: 40px;
      }
      #mavi-boot-splash .spinner-outer {
        position: relative;
        width: 60px;
        height: 60px;
        border: 3px solid rgba(59, 130, 246, 0.1);
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        animation: _bp_spin 1s linear infinite;
      }
      #mavi-boot-splash .spinner-inner {
        position: absolute;
        top: 6px; left: 6px; right: 6px; bottom: 6px;
        border: 3px solid transparent;
        border-top: 3px solid #00f2fe;
        border-radius: 50%;
        animation: _bp_spinRev 1.5s linear infinite;
      }
      #mavi-boot-splash .loading-text {
        margin-top: 25px;
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        animation: _bp_fadeBlink 1.5s ease-in-out infinite;
      }
      @keyframes _bp_spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes _bp_spinRev {
        0%   { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes _bp_logoPulse {
        0%, 100% { transform: scale(0.98); opacity: 0.8; text-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        50%      { transform: scale(1.02); opacity: 1;   text-shadow: 0 0 30px rgba(59, 130, 246, 0.8); }
      }
      @keyframes _bp_fadeBlink {
        0%, 100% { opacity: 0.4; }
        50%      { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Boot splash lives OUTSIDE #root so React never nukes it.
         It is removed by main.jsx after the first React render. -->
    <div id="mavi-boot-splash">
      <div class="logo-glow">MAVI MES</div>
      <div class="logo-sub">Execution System</div>
      <div class="spinner-outer">
        <div class="spinner-inner"></div>
      </div>
      <div class="loading-text">Memuat Sistem &amp; Modul CAD 3D...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
